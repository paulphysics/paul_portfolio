name: Extract Paul Portfolio ZIP

on:
  push:
    paths:
      - 'paul_portfolio.zip'
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  unzip-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the unzipped folders back to GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Portfolio with Nested Folders
        run: |
          if [ -f "paul_portfolio.zip" ]; then
            echo "File found! Unzipping now..."
            unzip -o paul_portfolio.zip
            rm paul_portfolio.zip
          else
            echo "❌ ERROR: Could not find 'paul_portfolio.zip' in the root repository folder."
            echo "Please verify that the file name matches perfectly and is uploaded directly to the root."
            exit 1
          fi

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add .
          
          # Commits the new nested folders if changes are found
          if ! git diff --cached --quiet; then
            git commit -m "Automated unzip: Extracted paul_portfolio nested folders"
            git push
          else
            echo "No new files found to commit."
          fi
